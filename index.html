<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>बाबा योगीराज क्लब, चियांकी</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#fffaf0}
nav{background:#7a0000;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:20}
.hero{position:relative}
.hero img{width:100%;height:auto;display:block}
.hero-logo{position:absolute;left:50%;bottom:-45px;transform:translateX(-50%);width:110px;height:110px;border-radius:50%;border:4px solid #fff;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.title-section{text-align:center;padding:60px 15px 10px}
.section{max-width:1100px;margin:auto;padding:22px 14px}
.card{background:#fff;padding:20px;border-radius:14px;line-height:1.8;box-shadow:0 5px 18px rgba(0,0,0,.07);border-top:6px solid #7a0000}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gallery img{width:100%;height:175px;object-fit:cover;border-radius:10px}
.red-banner{border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.2);border:3px solid #7a0000}
.red-banner img{width:100%;display:block}
footer{background:#111;color:#888;padding:22px;text-align:center}
</style>
</head>
<body>
<nav><b>बाबा योगीराज क्लब</b><span>822102</span></nav>

<!-- HARA WALA UPAR -->
<div class="hero">
<img src="puja-poster.jpg" alt="Green Banner Upar">
<img class="hero-logo" src="FB_IMG_1790343236325.jpg" alt="Logo">
</div>

<div class="title-section">
<h1 style="color:#7a0000">बाबा योगीराज क्लब, चियांकी</h1>
<p>चियांकी पहाड़ी टोला, मेदिनीनगर, पलामू - 822102</p>
</div>

<div class="section">
<div class="card">
<b>हमारे बारे में:</b> बाबा योगीराज क्लब चियांकी के युवाओं द्वारा संचालित संगठन है। सरस्वती पूजा, होली समारोह और समाज सेवा हमारा मुख्य लक्ष्य है।
</div>
</div>

<div class="section">
<h2 style="text-align:center;color:#7a0000">गैलरी</h2>
<div class="gallery" style="margin-top:12px">
<img src="IMG-20260925-WA0033.jpg">
<img src="IMG-20260922-WA8504.jpg">
<img src="IMG-20260905-WA0011.jpg">
<img src="IMG-20260501-WA0008.jpg">
<img src="IMG-20260501-WA0009.jpg">
<img src="FB_IMG_1790343258697.jpg">
</div>
</div>

<!-- RED WALA THODA NICHE -->
<div class="section">
<h2 style="text-align:center;color:#7a0000">हमारा लाल बैनर</h2>
<div class="red-banner" style="margin-top:12px">
<img src="banner.jpg" alt="Red Banner Niche">
<!-- अगर तुम्हारे लाल बैनर का नाम red.jpg है तो banner.jpg को red.jpg कर देना -->
</div>
</div>

<footer>© 2026 बाबा योगीराज क्लब, चियांकी</footer>
</body>
</html>
