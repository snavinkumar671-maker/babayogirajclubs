<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>बाबा योगीराज क्लब</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#fdf6e3}
nav{background:#4a0a0a;color:#fff;padding:6px;text-align:center;font-size:11px;display:flex;justify-content:space-between;padding:6px 10px}
.top{text-align:center;background:#fff;padding:10px}
.top .oval{width:100%;height:230px;object-fit:cover;border-radius:50% / 60%;border:4px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.top .logo{width:90px;height:90px;border-radius:50%;border:3px solid #7a0000;margin-top:-45px;background:#fff;position:relative;z-index:2}
.box{max-width:800px;margin:auto;padding:8px}
.card{background:#fff;padding:10px;border-radius:8px;font-size:13px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gallery img{width:100%;height:130px;object-fit:cover;border-radius:8px;display:block}
.red-banner{margin-top:12px;background:#fff;padding:8px;border-radius:10px}
.red-banner img{width:100%;height:auto;border-radius:8px;display:block}
footer{background:#111;color:#777;text-align:center;padding:12px;font-size:11px;margin-top:10px}
</style>
</head>
<body>
<nav><span>बाबा योगीराज क्लब</span><span>822102</span></nav>

<div class="top">
<img class="oval" src="FB_IMG_1790343236325.jpg" alt="Pandal">
<img class="logo" src="logo.jpg" alt="Baba Logo">
<h3 style="color:#4a0a0a;margin-top:6px">बाबा योगीराज क्लब, चियांकी</h3>
<p style="font-size:11px;color:#666">चियांकी पहाड़ी टोला, मेदिनीनगर, पलामू - 822102</p>
</div>

<div class="box">
<div class="card"><b>हमारे बारे में:</b> बाबा योगीराज क्लब चियांकी के युवाओं द्वारा संचालित संगठन है। सरस्वती पूजा, होली समारोह और समाज सेवा हमारा मुख्य लक्ष्य है।</div>

<h4 style="text-align:center;color:#4a0a0a;margin:10px 0">गैलरी</h4>
<div class="gallery">
<img src="IMG-20260925-WA0033.jpg">
<img src="IMG-20260922-WA8504.jpg">
<img src="IMG-20260905-WA0011.jpg">
<img src="IMG-20260501-WA0008.jpg">
<img src="IMG-20260501-WA0009.jpg">
<img src="FB_IMG_1790343258697.jpg">
</div>

<!-- YE WALA AB SAHI HO JAYEGA -->
<div class="red-banner">
<h4 style="text-align:center;color:#4a0a0a;margin-bottom:6px">हमारा लाल बैनर</h4>
<img src="red-banner.jpg" alt="Red Banner">
</div>

</div>
<footer>© 2026 बाबा योगीराज क्लब, चियांकी</footer>
</body>
</html>
